#VRML_SIM R2025a utf8

PROTO FourWheelRobot [
  field SFVec3f    translation  0 0 0.2
  field SFRotation rotation     0 0 1 0
  field SFString   controller   "<generic>"
]
{
Robot {
  translation IS translation
  rotation IS rotation
  controller IS controller
  children [
    DEF BODY Shape {
      appearance PBRAppearance {
        baseColor 0.917647 0.145098 0.145098
        roughness 1
        metalness 0
      }
      geometry Box {
        size 0.26 0.74 0.13
      }
    }
    Transform {
      translation 0 0.115 0.225
      children [
        DEF TOP_BOX Shape {
          appearance PBRAppearance {
            baseColor 0.2 0.2 0.2 
            roughness 0.8
            metalness 0.2
          }
          geometry Box {
            size 0.26 0.24 0.32
          }
        }
      ]
    }
    Transform {
      translation 0 0.245 0.3975
      children [
        DEF CAMERA_MOUNT Shape {
          appearance PBRAppearance {
            baseColor 0.15 0.15 0.15 
            roughness 0.9
            metalness 0.1
          }
          geometry Box {
            size 0.04 0.06 0.025  
          }
        }
      ]
    }
    Transform {
      translation 0 0.275 0.3975
      rotation 1 0 0 -0.523599
      children [
        DEF D415_VISUAL Shape {
          appearance PBRAppearance {
            baseColor 0.7 0.7 0.7 
            roughness 0.4
            metalness 0.6
          }
          geometry Box {
            size 0.09 0.025 0.025
          }
        }
        Camera {
          name "d415_rgb"
          rotation 0 0 1 1.5708
          width 640
          height 480
          fieldOfView 1.204  # ~69 degrees horizontally for D415
        }
        RangeFinder {
          name "d415_depth"
          rotation 0 0 1 1.5708
          width 640
          height 480
          fieldOfView 1.134  # ~65 degrees horizontally for D415
          minRange 0.3       # D415 optimal min range is around 0.3m
          maxRange 10
        }
        LightSensor {
          name "sunlight_sensor"
          rotation 0 0 1 1.5708
        }
      ]
    }
    
    # ---------------- ล้อหน้าขวา ----------------
    DEF WHEEL1 Hinge2Joint {
      jointParameters HingeJointParameters {
        axis 0 0 1               
        anchor 0.17 0.28 -0.05
      }
      jointParameters2 JointParameters {
        axis 1 0 0               
      }
      device [
        RotationalMotor {
          name "steer1"
          minPosition -0.785
          maxPosition 0.785
        }
      ]
      device2 [
        RotationalMotor {
          name "wheel1"
        }
      ]
      endPoint Solid {
        translation 0.17 0.28 -0.05
        children [
          DEF WHEEL Transform {
            rotation 0 1 0 1.5708   # <--- จุดนี้คือตัวแก้ให้ล้อตั้งตรงขึ้นมาครับ
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.305882 0.898039 0.25098
                  roughness 1
                  metalness 0
                }
                geometry Cylinder {
                  height 0.06
                  radius 0.0625  
                }
              }
            ]
          }
        ]
        name "solid(0)"
        boundingObject USE WHEEL
        physics Physics {
        }
      }
    }
    
    # ---------------- ล้อหน้าซ้าย ----------------
    DEF WHEEL2 Hinge2Joint {
      jointParameters HingeJointParameters {
        axis 0 0 1
        anchor -0.17 0.28 -0.05
      }
      jointParameters2 JointParameters {
        axis 1 0 0
      }
      device [
        RotationalMotor {
          name "steer2"
          minPosition -0.785
          maxPosition 0.785
        }
      ]
      device2 [
        RotationalMotor {
          name "wheel2"
        }
      ]
      endPoint Solid {
        translation -0.17 0.28 -0.05
        children [
          USE WHEEL
        ]
        name "solid(1)"
        boundingObject USE WHEEL
        physics Physics {
        }
      }
    }
    
    # ---------------- ล้อหลังขวา ----------------
    DEF WHEEL3 HingeJoint {
      jointParameters HingeJointParameters {
        axis 1 0 0
        anchor 0.17 -0.28 -0.05
      }
      device [
        RotationalMotor {
          name "wheel3"
        }
      ]
      endPoint Solid {
        translation 0.17 -0.28 -0.05
        children [
          USE WHEEL
        ]
        name "solid(2)"
        boundingObject USE WHEEL
        physics Physics {
        }
      }
    }
    
    # ---------------- ล้อหลังซ้าย ----------------
    DEF WHEEL4 HingeJoint {
      jointParameters HingeJointParameters {
        axis 1 0 0
        anchor -0.17 -0.28 -0.05
      }
      device [
        RotationalMotor {
          name "wheel4"
        }
      ]
      endPoint Solid {
        translation -0.17 -0.28 -0.05
        children [
          USE WHEEL
        ]
        name "solid(3)"
        boundingObject USE WHEEL
        physics Physics {
        }
      }
    }
  ]
  boundingObject USE BODY
  physics Physics {
    density -1
    mass 1
  }
}
}